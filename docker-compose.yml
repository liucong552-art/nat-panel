services:
  web:
    build: .
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: natcloud
      MYSQL_USER: natcloud
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - nc_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  nc_db:
